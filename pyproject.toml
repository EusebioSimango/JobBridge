[project]
name = "kaziradar"
version = "0.1.0"
description = "Find jobs at home, abroad or remote, at any experience level, with SerpApi's Google Jobs API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "serpapi>=1.1.2",
    "typer>=0.27.3",
]

[project.scripts]
kaziradar = "kaziradar.cli:app"

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "markdown-it-py>=3.0.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "kaziradar[web]",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["kaziradar", "conftest"]
